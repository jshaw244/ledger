[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
description = "Public-record tracking — a module of the personal app hub"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3",
    "requests>=2.31",
]

[tool.setuptools]
packages = ["ledger", "ledger.fetch"]
include-package-data = true

[tool.setuptools.package-data]
ledger = ["templates/*.html"]
