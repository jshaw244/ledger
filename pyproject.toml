[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
description = "Public-record tracking — a module of the personal app hub"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3",
    "requests>=2.31",
]

[project.optional-dependencies]
# yfinance is the one non-government source here and the most breakage-prone
# dependency in the module, so it stays optional: without it the markets section
# reports an error and every other section still runs.
markets = ["yfinance>=0.2.40"]

[tool.setuptools]
packages = ["ledger", "ledger.fetch"]
include-package-data = true

[tool.setuptools.package-data]
ledger = ["templates/*.html"]
